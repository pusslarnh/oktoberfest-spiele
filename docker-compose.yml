services:
  oktoberfest:
    build: .
    # Eller använd den färdiga bilden från GitHub Container Registry:
    # image: ghcr.io/pusslarnh/oktoberfest-spiele:latest
    container_name: oktoberfest-spiele
    ports:
      # Porten på servern. Ändra via HOST_PORT under "Environment variables" i Portainer.
      - "${HOST_PORT:-8090}:3000"
    environment:
      # Sätt en PIN-kod så att bara domarna kan dela ut poäng (tomt = ingen PIN).
      ADMIN_PIN: "${ADMIN_PIN:-}"
    volumes:
      - oktoberfest-data:/data
    restart: unless-stopped

volumes:
  oktoberfest-data:
