<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Oktoberfest Spiele</title>
  <meta name="theme-color" content="#1c140e">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#topplista">
      <img src="logo.png" alt="" width="36" height="36">
      <span>Oktoberfest Spiele</span>
    </a>
    <span class="live-pill" id="livePill"><i></i><span>O’zapft is!</span></span>
    <nav class="nav" id="nav">
      <a href="#topplista" data-route="topplista"><i aria-hidden="true">🏆</i><span>Topplista</span></a>
      <a href="#poang" data-route="poang" class="admin-only"><i aria-hidden="true">🎯</i><span class="full">Poängutdelning</span><span class="short">Poäng</span></a>
      <a href="#lag" data-route="lag"><i aria-hidden="true">👥</i><span class="full">Deltagare &amp; Lag</span><span class="short">Lag</span></a>
      <a href="#grenar" data-route="grenar"><i aria-hidden="true">📜</i><span class="full">Grenar &amp; Regler</span><span class="short">Grenar</span></a>
    </nav>
    <button class="btn ghost" id="adminBtn" type="button" title="Logga in som domare">🔒 <span>Domare</span></button>
    <button class="btn ghost" id="fullscreenBtn" type="button" title="Storskärmsläge">⛶ <span>Storskärm</span></button>
  </header>
  <div class="ribbon" aria-hidden="true"></div>

  <main id="view" class="view"></main>

  <footer class="footer">
    <span><b>Oktoberfest Spiele</b> · Officiellt mästerskapssystem</span>
    <span>Oktoberfest 3 oktober · Gemütlichkeit &amp; sportsmanship</span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="pinDialog" class="modal">
    <form method="dialog" id="pinForm">
      <h3>Domarens PIN-kod</h3>
      <p>Logga in för att dela ut poäng, hantera lag och se facit.</p>
      <input id="pinInput" type="password" inputmode="numeric" autocomplete="off" required>
      <p class="pin-error" id="pinError" role="alert"></p>
      <div class="row end">
        <button class="btn ghost" type="button" onclick="this.closest('dialog').close('cancel')">Avbryt</button>
        <button class="btn gold" value="ok">Logga in</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
